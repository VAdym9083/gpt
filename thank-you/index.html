<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f4f0ea">
<title>Заявку отримано · Таргет LB</title>
<style>
:root{--paper:#f2eee7;--ink:#111214;--muted:#6d6862}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(circle at 14% 10%,rgba(126,177,255,.18),transparent 28%),radial-gradient(circle at 84% 14%,rgba(224,195,166,.28),transparent 30%),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(720px,100%);padding:clamp(28px,5vw,58px);border-radius:32px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.82);box-shadow:0 28px 90px rgba(24,20,16,.13);text-align:center}
.check{width:68px;height:68px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:#14241c;color:#fff;font-size:30px;font-weight:900;box-shadow:0 14px 36px rgba(31,61,44,.18)}
.eyebrow{color:#668DA6;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1{margin:12px 0 14px;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.055em}
p{max-width:560px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
a{min-height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;color:#fff;background:#17191c;border:1px solid #17191c}
a.secondary{color:#202225;background:rgba(255,255,255,.74);border-color:rgba(18,19,21,.10)}
.small{margin-top:18px;font-size:11px;color:#918a83}
@media(max-width:600px){.actions{grid-template-columns:1fr}.card{border-radius:24px}}
</style>
</head>
<body>
<main class="card" id="thankYouCard" hidden>
  <div class="check">✓</div>
  <div class="eyebrow" id="eyebrow">Заявку успішно надіслано</div>
  <h1 id="title">Дякую, заявку отримано</h1>
  <p id="text">Я отримав ваші дані й зв’яжуся з вами найближчим часом у вибраному вами месенджері</p>
  <div class="actions">
    <a href="https://t.me/target_vadym" target="_blank" rel="noopener">Telegram</a>
    <a class="secondary" href="/gpt/">Повернутися на сайт</a>
  </div>
  <div class="small">Таргет LB · Vadym — Performance Marketer</div>
</main>
<script>
(function(){
  const raw=sessionStorage.getItem('targetlb_verified_lead');
  let verified=null;
  try{verified=raw?JSON.parse(raw):null}catch(e){}
  const fresh=verified&&verified.token&&verified.ts&&(Date.now()-verified.ts<10*60*1000);
  if(!fresh){window.location.replace('/gpt/');return;}
  sessionStorage.removeItem('targetlb_verified_lead');

  const lang=new URLSearchParams(location.search).get('lang')||'uk';
  const copy={
    uk:{eyebrow:'Заявку успішно надіслано',title:'Дякую, заявку отримано',text:'Я отримав ваші дані й зв’яжуся з вами найближчим часом у вибраному вами месенджері',back:'Повернутися на сайт'},
    ru:{eyebrow:'Заявка успешно отправлена',title:'Спасибо, заявка получена',text:'Я получил ваши данные и свяжусь с вами в ближайшее время в выбранном вами мессенджере',back:'Вернуться на сайт'},
    en:{eyebrow:'Request successfully sent',title:'Thank you, I received your request',text:'I received your details and will contact you shortly through your preferred messenger',back:'Back to website'},
    es:{eyebrow:'Solicitud enviada correctamente',title:'Gracias, he recibido tu solicitud',text:'He recibido tus datos y me pondré en contacto contigo pronto por el canal que elegiste',back:'Volver al sitio'}
  };
  const c=copy[lang]||copy.uk;
  document.documentElement.lang=lang;
  document.getElementById('eyebrow').textContent=c.eyebrow;
  document.getElementById('title').textContent=c.title;
  document.getElementById('text').textContent=c.text;
  document.querySelector('.secondary').textContent=c.back;
  document.getElementById('thankYouCard').hidden=false;

  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init','1448174640737820');
  fbq('track','PageView');
  fbq('track','Lead',{lead_source:'website_form'});
})();
</script>
</body>
</html>
