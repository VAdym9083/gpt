name: Generate multilingual Telegram previews

on:
  push:
    branches:
      - multilingual-og-20261017
    paths:
      - scripts/build_share_previews.py
      - .github/workflows/generate-multilingual-og.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build complete multilingual pages and OG images
        run: python scripts/build_share_previews.py
      - name: Check static Open Graph markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          files={"uk":Path("index.html"),"ru":Path("ru/index.html"),"en":Path("en/index.html"),"es":Path("es/index.html")}
          class P(HTMLParser):
              def __init__(self): super().__init__();self.m={}
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="meta" and ("property" in d or "name" in d):
                      self.m[d.get("property",d.get("name"))]=d.get("content")
          pics=set()
          for lang,path in files.items():
              p=P();p.feed(path.read_text())
              im=p.m["og:image"]; pics.add(im)
              assert "/og-target-lb-"+lang+"-" in im,(lang,im)
              assert Path("assets/site/"+im.rsplit("/",1)[-1]).exists()
              assert p.m["twitter:image"]==im
              assert p.m["og:locale"]=={"uk":"uk_UA","ru":"ru_RU","en":"en_US","es":"es_ES"}[lang]
              assert p.m["og:image:width"]=="1200"
              assert p.m["og:image:height"]=="630"
              assert p.m["og:url"]=="https://vadym9083.github.io/gpt/"+(lang+"/" if lang!="uk" else "")
              print(lang,p.m["og:title"],im)
          assert len(pics)==4
          assert Path("index.html").read_bytes()==Path("cleaning-canada.html").read_bytes()
          print("ALL_OG_HTML_ASSERTIONS_PASS")
          PY
      - name: Commit generated site and artwork to staging branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html cleaning-canada.html ru/index.html en/index.html es/index.html assets/site/og-target-lb-{uk,ru,en,es}-20261017.jpg
          git diff --cached --check
          git commit -m "Publish localized Meta Ads landing pages and four matching Telegram images"
          git push origin HEAD:multilingual-og-20261017
