name: Chronograph One Watchface APK
on:
  push:
    branches: ['build/chronograph-one-wearos-20261014']
  pull_request:
    paths: ['chronograph-one/**', '.github/workflows/chronograph-one-build.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate graphics
        working-directory: chronograph-one
        run: |
          python3 -m pip install Pillow --quiet
          python3 assets_gen.py
      - name: Compile wearable APK
        working-directory: chronograph-one
        run: gradle :watchface:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chronograph-One-WearOS-APK
          path: chronograph-one/watchface/build/outputs/apk/debug/*.apk
