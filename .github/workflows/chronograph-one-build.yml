name: Chronograph One Watchface APK
on:
  push:
    branches: ['build/chronograph-one-wearos-20261014']
  pull_request:
    paths: ['chronograph-one/**', '.github/workflows/chronograph-one-build.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android commandline tools and SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/commandlinetools.zip
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-cmd
          mv /tmp/android-cmd/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate graphics
        working-directory: chronograph-one
        run: |
          python3 -m pip install Pillow --quiet
          python3 assets_gen.py
      - name: Validate official Watch Face Format XML
        run: |
          curl -fsSL https://github.com/google/watchface/releases/download/release/wff-validator.jar -o /tmp/wff-validator.jar
          java -jar /tmp/wff-validator.jar 1 chronograph-one/watchface/src/main/res/raw/watchface.xml
      - name: Compile wearable APK
        working-directory: chronograph-one
        run: gradle :watchface:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chronograph-One-WearOS-APK
          path: chronograph-one/watchface/build/outputs/apk/debug/*.apk
