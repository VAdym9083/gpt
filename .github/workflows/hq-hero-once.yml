name: Build HQ hero asset once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-hq-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download original hero source
        run: |
          curl --fail --location --retry 3 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/af97f6d0-b1dd-400f-afb2-e280cf973233.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmJlZThhNWIzMTEzOWU4MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg3NDA3NX0.LWsQ9N-0Y9ZHtUBrGr8aeK3hedmOPBL48sP2-ipHodA' \
            --output /tmp/hero-source.png

      - name: Create maximum-quality WebP
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          src = Image.open('/tmp/hero-source.png').convert('RGB')
          src = src.filter(ImageFilter.UnsharpMask(radius=0.5, percent=45, threshold=3))
          src.save('assets/site/hero-designer-glass-hq-20260929.webp',
                   'WEBP', quality=100, method=6)
          print(src.size)
          PY

      - name: Point both pages to HQ asset
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'assets/site/hero-designer-glass-20260929.webp'
          new = 'assets/site/hero-designer-glass-hq-20260929.webp'
          for name in ('index.html', 'cleaning-canada.html'):
              p = Path(name)
              s = p.read_text()
              if old in s:
                  s = s.replace(old, new)
              elif new not in s:
                  raise SystemExit(f'Hero asset path not found in {name}')
              p.write_text(s)
          PY

      - name: Commit HQ asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site/hero-designer-glass-hq-20260929.webp index.html cleaning-canada.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade hero background quality"
          git push
