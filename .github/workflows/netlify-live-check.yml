name: Check live Netlify deployment

on:
  push:
    branches: ["netlify-leads"]
    paths: [".github/workflows/netlify-live-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify site and function without sending a lead
        shell: bash
        run: |
          set -u
          DOMAIN="lively-elf-ba1204.netlify.app"
          echo "CHECK_SITE=$DOMAIN"
          getent ahostsv4 "$DOMAIN" | head -3 || true
          for ATTEMPT in 1 2 3 4 5 6 7 8 9; do
            echo "ATTEMPT=$ATTEMPT"
            SITE_CODE=$(curl -sSL --max-time 10 -o /tmp/site-body -w '%{http_code}' "https://$DOMAIN/" || true)
            FUNCTION_CODE=$(curl -sSL --max-time 10 -o /tmp/function-body -w '%{http_code}' "https://$DOMAIN/.netlify/functions/lead" || true)
            echo "SITE_HTTP=$SITE_CODE FUNCTION_HTTP=$FUNCTION_CODE"
            if grep -q "Target LB · Сервіс заявок" /tmp/site-body 2>/dev/null; then echo "EXPECTED_PAGE=YES"; else echo "EXPECTED_PAGE=NO"; fi
            if grep -q '"status":"ready"' /tmp/function-body 2>/dev/null; then echo "FUNCTION_READY=YES"; else echo "FUNCTION_READY=NO"; fi
            if [ "$SITE_CODE" = "200" ] && [ "$FUNCTION_CODE" = "200" ] && grep -q "Target LB · Сервіс заявок" /tmp/site-body && grep -q '"status":"ready"' /tmp/function-body; then
              echo "NETLIFY_VERIFIED=YES"
              exit 0
            fi
            [ "$ATTEMPT" = "9" ] && break
            sleep 12
          done
          echo "NETLIFY_VERIFIED=NO"
          exit 1
