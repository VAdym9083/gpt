name: Test full resolution temporary media transfer
on:
  push:
    branches: [feature/premium-og-cdn-test]
    paths: ['.github/workflows/check-canva-high-res.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
