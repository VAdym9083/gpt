name: Build realistic hero asset once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-realistic-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download generated hero source
        run: |
          curl --fail --location --retry 3 \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/b1abc9b3-6f09-4f99-8572-35a3b15cd2a3/b9632c4f-97bd-49b2-a8a5-2571ab039810/Photorealistic_premium_website_hero_background_for_a_high_en.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzFmYTNlZWEyNDgxYjg4NyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg3MzE5NH0.3Y6Aw6q6hbfECFFv5V8HvAeDuMpKreGzjwtElb2zVCc' \
            --output /tmp/hero-source.png

      - name: Create optimized high-quality WebP
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          src = Image.open('/tmp/hero-source.png').convert('RGB')
          if src.width > 2560:
              h = round(src.height * 2560 / src.width)
              src = src.resize((2560, h), Image.Resampling.LANCZOS)
          src = src.filter(ImageFilter.UnsharpMask(radius=0.45, percent=30, threshold=3))
          out = Path('assets/site/hero-marketing-workspace-20260929.webp')
          src.save(out, 'WEBP', quality=94, method=6)
          print(f'{src.width}x{src.height} {out.stat().st_size} bytes')
          PY

      - name: Update both pages
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'assets/site/hero-designer-glass-hq-20260929.webp'
          new = 'assets/site/hero-marketing-workspace-20260929.webp'
          mobile_old = 'background-position:23% center!important'
          mobile_new = 'background-position:62% center!important'
          for name in ('index.html', 'cleaning-canada.html'):
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Old hero path missing in {name}')
              s = s.replace(old, new)
              if mobile_old not in s:
                  raise SystemExit(f'Mobile crop anchor missing in {name}')
              s = s.replace(mobile_old, mobile_new)
              p.write_text(s)
          PY

      - name: Commit realistic hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site/hero-marketing-workspace-20260929.webp index.html cleaning-canada.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace hero with realistic marketing workspace"
          git push
